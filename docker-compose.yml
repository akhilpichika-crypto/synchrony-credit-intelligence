services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: credit-intelligence-db

    environment:
      POSTGRES_DB: credit_intelligence
      POSTGRES_USER: credit_user
      POSTGRES_PASSWORD: credit_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: